<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu3D - Sitemap demo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
    }
  </style>
</head>

<body>
  <div>
    <h1>Sitemap demo</h1>
    <p>Trang này không có link nào — menu lấy danh sách từ <code>/example/sitemap.xml</code>,<br />
      tối đa 5 trang và bỏ qua page6, page7.</p>
  </div>

  <script src="/menu3d.js"
          data-source="sitemap"
          data-sitemap="/example/sitemap.xml"
          data-max="5"
          data-exclude="/example/page/page6,/example/page/page7"></script>
</body>

</html>
