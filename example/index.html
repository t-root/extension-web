<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu3D - Interactive 3D Menu</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .info-stack {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
      z-index: 10;
      user-select: none;
    }

    .info-title {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .info-hint {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.6;
    }
    .demo-nav {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 11;
    }

    .demo-nav a {
      color: #fff;
      opacity: 0.8;
      text-decoration: none;
    }

    .menu-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ccc;
      z-index: 10;
    } 
  </style>
</head>

<body>
  <div class="menu-container"></div>
  <!-- Menu3D tự lấy các link trong <nav> làm danh sách trang -->
  <nav class="demo-nav">
    <a href="/example/page/page1.html">Template for menu with long name</a>
    <a href="/example/page/page2.html">Page2</a>
    <a href="/example/page/page3.html">Page3</a>
    <a href="/example/page/page4.html">Page4</a>
    <a href="/example/page/page5.html">Page5</a>
    <a href="/example/page/page6.html">Page6</a>
    <a href="/example/page/page7.html">Page7</a>
    <a href="/example/page/long.html">Long page</a>
  </nav>
  <div class="info-stack">
    <div class="info-title">Menu3D Demo</div>
    <div class="info-hint">
      • Click the floating icon to show or hide the 3D menu<br />
      • Drag to rotate • Scroll to fine-tune the angle • Hover to pause auto-spin
    </div>
  </div>
  <!-- Chỉ cần 1 dòng này, không cần config -->
  <script src="/menu3d.js"></script>
</body>

</html>
