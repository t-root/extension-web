<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Long page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8vw;
      font-weight: bold;
    }

    section:nth-child(1) { background: #e53935; }
    section:nth-child(2) { background: #fb8c00; }
    section:nth-child(3) { background: #43a047; }
    section:nth-child(4) { background: #1e88e5; }
    section:nth-child(5) { background: #8e24aa; }
  </style>
</head>

<body>
  <!-- Trang dài 5 màn hình: dùng để thử chụp cả trang (card sẽ cao và hẹp) -->
  <section>1</section>
  <section>2</section>
  <section>3</section>
  <section>4</section>
  <section>5</section>
</body>

</html>
